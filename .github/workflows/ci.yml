name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (Python ${{ matrix.python-version }})
    # Ubuntu 26.04 runners no longer ship Python 3.9; 24.04 still does.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the macOS system Python; 3.12 is the deployment target.
        python-version: ["3.9", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studyflow
          POSTGRES_PASSWORD: studyflow
          POSTGRES_DB: studyflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studyflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check app tests
      - name: Test (SQLite)
        run: python -m pytest tests -q
      - name: Test (Postgres)
        env:
          STUDYFLOW_TEST_DATABASE_URL: postgresql://studyflow:studyflow@localhost:5432/studyflow_test
        run: python -m pytest tests -q

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
