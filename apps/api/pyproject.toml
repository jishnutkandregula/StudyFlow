[project]
name = "studyflow-api"
version = "0.1.0"
description = "Explainable academic planning API for StudyFlow"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "httpx>=0.27,<1.0",
  "cryptography>=43,<47",
  # Lets Pydantic evaluate `X | None` annotations on Python 3.9.
  "eval_type_backport>=0.2; python_version < '3.10'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py39"  # match requires-python so autofixes stay 3.9-safe
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP042"]

[tool.setuptools]
packages = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection uses Depends() in argument defaults by design.
extend-immutable-calls = ["fastapi.Depends"]
